author: Connor Frank
title: Connor Frank's Blog
email: conjfrnk+blog@gmail.com
description: "A place where I occasionally post things"
baseurl: ""
url: "https://conjfrnk.github.io"
twitter_username: conjfrnk
github_username:  conjfrnk

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Only these pages appear in the header nav.
# Other top-level pages (e.g. monaco/privacy, monaco/terms) still build and
# are reachable via their permalinks, they just don't show up in the menu.
header_pages:
  - about.markdown

# Skip Jekyll's usual non-source directories plus local-only workflow dirs.
# (Listed explicitly because setting `exclude:` at all seems to replace rather
# than extend Jekyll's internal default list in this setup.)
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - docs/

markdown: kramdown
permalink: pretty

highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# (The Jekyll-generated exclude template block that used to live here has been
# removed; see the active `exclude:` block near the top of this file.)
