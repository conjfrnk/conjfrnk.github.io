author: Connor Frank
title: Connor Frank's Blog
email: conjfrnk+blog@gmail.com
description: "A place where I occasionally post things"
baseurl: ""
url: "https://conjfrnk.github.io"
twitter_username: conjfrnk
github_username:  conjfrnk

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Only these pages appear in the header nav.
# Other top-level pages (e.g. monaco/privacy, monaco/terms) still build and
# are reachable via their permalinks, they just don't show up in the menu.
header_pages:
  - about.markdown

markdown: kramdown
permalink: pretty

highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
